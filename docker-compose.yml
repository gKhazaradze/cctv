# Production: citywatch runs as a NETWORK-ONLY container behind the platform's
# Caddy edge. It publishes NO host ports and joins its own external
# `edge-citywatch` network (shared only with Caddy), where Caddy reaches it as `citywatch:80` and serves it at
# citywatch.<domain>. (See the platform repo's CONTRACT.md.)
#
#   docker compose up -d --build      # build + start (no host port published)
#
# Local preview (publishes localhost:8080, so you can actually open it):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Stop with: docker compose down
#
# Its edge network must exist:  docker network create edge-citywatch
#
# ON THE SERVER the image is never built — it is pulled. That box has 909 MB of
# RAM and no swap, and a Rollup build there once exhausted memory and took every
# site on it down. CI builds on the runner, pushes to GHCR, and the deploy runs
# `docker compose pull app && docker compose up -d --no-build app`.

services:
  # Production build behind nginx. This is the one that stays up.
  app:
    # `build` is kept for LOCAL use (`up --build`). The server pulls `image`
    # instead and passes --no-build, so it can never start a build of its own.
    build:
      context: .
      target: runtime
    # Pin a specific build to roll back:  CITYWATCH_TAG=<git-sha> docker compose up -d
    image: ghcr.io/gkhazaradze/citywatch:${CITYWATCH_TAG:-latest}
    container_name: citywatch      # stable name the platform Caddyfile targets
    environment:
      # Optional. Free key from https://api.windy.com/keys ("Webcams" product).
      # Read at container start-up, so adding it needs a restart, not a rebuild.
      WINDY_API_KEY: "${WINDY_API_KEY:-}"
      # The start-up script writes config.js here (/run is a tmpfs: /var/run
      # below, the same directory), not into the read-only web root;
      # docker/nginx.conf serves /config.js from it.
      CITYWATCH_CONFIG_PATH: /run/citywatch-config.js
    restart: unless-stopped
    # Hardening (security fix plan 5.5): a read-only root (nginx's temp dirs,
    # its pid and the runtime config.js live in memory), only the capabilities
    # nginx's root master needs to bind :80 and drop to the `nginx` user, and a
    # memory / process cap.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    pids_limit: 64
    networks: [edge]

  # Hot-reloading dev server against your working tree.
  #   docker compose --profile dev up dev
  # Local-only: keeps its host port and stays off the edge network.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: citywatch-dev:latest
    container_name: citywatch-dev
    ports:
      - "${CITYWATCH_DEV_PORT:-5173}:5173"
    environment:
      VITE_WINDY_API_KEY: "${WINDY_API_KEY:-}"
    volumes:
      - .:/app
      # Keeps the image's linux-native node_modules instead of letting the host's
      # darwin binaries shadow it through the bind mount above.
      - /app/node_modules
    # Deliberately not "unless-stopped": a dev server should come up when you
    # ask for it, not silently after every reboot.
    restart: "no"

  # The optional RTSP bridge (go2rtc) is NOT here: it lives in
  # docker-compose.rtsp.yml and runs only on your own machine, because its API
  # can run commands and this file is what the internet-facing server uses.

  # One-shot camera health check.
  #   docker compose --profile tools run --rm check
  check:
    profiles: ["tools"]
    build:
      context: .
      target: base
    image: citywatch-tools:latest
    environment:
      WINDY_API_KEY: "${WINDY_API_KEY:-}"
    command: ["npm", "run", "check:cams"]

networks:
  # This app's own edge network, shared with the platform's Caddy and
  # nothing else, so no other container on the box can reach it (security
  # fix plan 5.2). Created out-of-band — CI does it if missing — and Caddy
  # routes citywatch.<domain> to this container over it.
  edge:
    external: true
    name: edge-citywatch
