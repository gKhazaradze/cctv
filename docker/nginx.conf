server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Stop nginx logging a 404 storm for favicons and similar.
    log_not_found off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # Written at start-up from the container environment — must never be cached,
    # or a restart with a new key would keep serving the old one.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell must always be revalidated so a redeploy is picked up promptly.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app: unknown paths fall through to the shell.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
