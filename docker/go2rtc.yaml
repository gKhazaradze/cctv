# go2rtc configuration for the optional RTSP -> browser bridge.
#
# Only used by docker-compose.rtsp.yml, on your own machine (never the server:
# this API has no login and can add `exec:` sources, which run commands):
#   docker compose -f docker-compose.rtsp.yml up -d
#
# Add one entry per camera under `streams`. The key becomes the stream name; the
# value is the camera's real source URL. Then in the CityWatch "Add camera"
# dialog choose type HLS and use:
#
#   http://localhost:1984/api/stream.m3u8?src=<name>
#
# go2rtc's own dashboard (http://localhost:1984) is handy for confirming a
# camera connects before you wire it into the app. `listen` stays ":1984"
# inside the container; the compose file publishes it on 127.0.0.1 only.

api:
  listen: ":1984"

streams:
  # example-cam: rtsp://user:pass@192.168.1.50:554/Streaming/Channels/101
  # backyard:    rtsp://192.168.1.51:554/live
