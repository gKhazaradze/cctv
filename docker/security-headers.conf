# Included by every location block in nginx.conf.
#
# nginx's add_header does NOT merge across levels: a location block that sets
# any add_header of its own discards every header inherited from the server
# block. Since each location here sets its own Cache-Control, the security
# headers have to be repeated inside each one — hence this include.
#
# The app embeds third-party camera feeds — including cameras added by IP that
# are only reachable over plain HTTP — so img/media/connect/frame must allow both
# http: and https: broadly; a public camera can live on any host. This is a
# deliberate, purpose-driven loosening for a personal aggregator. The one control
# that stays strict is the one that matters most: script-src is 'self' only (the
# production build emits no inline scripts), so no third-party host can run code.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http:; frame-src https: http:; font-src 'self' data:" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
