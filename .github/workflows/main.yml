name: Deploy (Docker)

# The image is built HERE, on the runner, and pushed to GHCR. The server only
# pulls it.
#
# This is not a stylistic choice: the box has 909 MB of RAM, 2 vCPUs and no
# swap, and with roadtrip/availability/bustracker running there is ~380 MB free.
# A Rollup production build wants 0.5-1.5 GB, so building there exhausted memory
# and wedged the whole instance — every site on it went down until a reboot.
# The runner has 7 GB and no production traffic. Keep the build here.

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual triggering from the GitHub UI

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must be lowercase — GHCR rejects mixed-case names (the owner is "gKhazaradze").
  IMAGE: ghcr.io/gkhazaradze/citywatch

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest      # x86_64, matching the box — no QEMU emulation
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write           # push (and pull) the image on ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate compose files
        run: |
          # Production config and the local overlay both need to parse. The
          # optional WINDY_API_KEY is unset here, exactly as it may be on the
          # server, so this resolves with no .env.
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # The runtime stage runs `tsc --noEmit && vite build` in its build stage,
        # so a type error fails here and nothing gets pushed — this step is the
        # typecheck gate as well as the build.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH (the box runs deploy/on-box.sh at this commit)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # this job's own, gone when it ends
        run: |
          # This repo's own key signs in as the box's unprivileged `deploy` user,
          # which pins it to one command: deploy this app at the commit sent
          # (my_home_page/deploy/box). No script travels from here — the box
          # runs deploy/on-box.sh as committed on the branch — and the host key
          # is pinned, so a stolen key or a man in the middle gets at most a
          # redeploy of what is already on main (security fix plan 5.4).
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$EC2_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFe7pJ2Ic/SxJmjzozAvmblXVkDJGrokHVRc0yLcMGTD' > ~/.ssh/known_hosts
          printf '%s %s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "deploy@$EC2_HOST" "$GITHUB_SHA"

      - name: Post-deploy public health check
        run: |
          # citywatch is served by Caddy at its subdomain over HTTPS.
          # Set repo secret CITYWATCH_URL = https://citywatch.<domain>
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 5 "${{ secrets.CITYWATCH_URL }}/" > /dev/null; then
              echo "Public endpoint healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Public endpoint not responding"
          exit 1
