name: Deploy (Docker)

# The image is built HERE, on the runner, and pushed to GHCR. The server only
# pulls it.
#
# This is not a stylistic choice: the box has 909 MB of RAM, 2 vCPUs and no
# swap, and with roadtrip/availability/bustracker running there is ~380 MB free.
# A Rollup production build wants 0.5-1.5 GB, so building there exhausted memory
# and wedged the whole instance — every site on it went down until a reboot.
# The runner has 7 GB and no production traffic. Keep the build here.

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual triggering from the GitHub UI

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must be lowercase — GHCR rejects mixed-case names (the owner is "gKhazaradze").
  IMAGE: ghcr.io/gkhazaradze/citywatch

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest      # x86_64, matching the box — no QEMU emulation
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write           # push (and pull) the image on ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          # Production config and the local overlay both need to parse. The
          # optional WINDY_API_KEY is unset here, exactly as it may be on the
          # server, so this resolves with no .env.
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # The runtime stage runs `tsc --noEmit && vite build` in its build stage,
        # so a type error fails here and nothing gets pushed — this step is the
        # typecheck gate as well as the build.
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # GITHUB_TOKEN is scoped to this run and expires with it, so the box
          # never stores a long-lived registry credential.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail

            # First deploy on a fresh box: clone ourselves rather than making
            # someone SSH in to do it by hand. The repo is public, so this needs
            # no credentials on the server. /srv is root-owned, hence sudo for
            # the clone; ownership then moves to the login user so every later
            # fetch/reset runs unprivileged, like the other projects.
            echo "--- Ensuring the checkout exists ---"
            if [ ! -d /srv/citywatch/.git ]; then
              echo "no checkout at /srv/citywatch — cloning"
              sudo git clone https://github.com/gKhazaradze/cctv.git /srv/citywatch
              sudo chown -R "$(id -un)":"$(id -gn)" /srv/citywatch
            fi

            # git runs as the LOGIN USER, not root: /srv/citywatch is owned by
            # that user. Only docker needs sudo (the same NOPASSWD sudoers rule
            # the other projects rely on). The checkout is still needed even
            # though the image is prebuilt — it carries the compose file.
            echo "--- Syncing latest code ---"
            git config --global --add safe.directory /srv/citywatch || true
            git -C /srv/citywatch fetch --prune origin main
            git -C /srv/citywatch reset --hard origin/main

            echo "--- Ensuring this app's edge network exists ---"
            # Our compose joins `edge-citywatch`, shared only with the platform's Caddy
            # (security fix plan 5.2). Create it if missing and make sure Caddy is
            # on it, so a first deploy never depends on the platform's own order.
            sudo docker network inspect edge-citywatch >/dev/null 2>&1 || sudo docker network create edge-citywatch
            sudo docker network connect edge-citywatch caddy 2>/dev/null || true

            echo "--- Pulling the prebuilt image ---"
            # GHCR packages default to private even for a public repo, so
            # authenticate with this run's token, then drop it again.
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd /srv/citywatch
            sudo docker compose pull app

            echo "--- Starting the container ---"
            # --no-build is load-bearing: it makes it structurally impossible
            # for this box to attempt a Rollup build, whatever the compose file
            # says. See the note at the top of this workflow.
            sudo docker compose up -d --no-build app

            sudo docker logout ghcr.io >/dev/null 2>&1 || true

            echo "--- Pruning dangling images (keep disk in check) ---"
            # Each deploy leaves the previous image untagged; unpruned they fill
            # the small root volume.
            sudo docker image prune -f >/dev/null 2>&1 || true

            echo "--- Waiting for nginx to answer (inside the container) ---"
            # citywatch publishes no host port (Caddy owns the edge), so probe
            # the app directly inside the container instead of host :80.
            for i in $(seq 1 15); do
              if sudo docker exec citywatch wget -q --spider http://127.0.0.1/ 2>/dev/null; then
                echo "App is healthy"; exit 0
              fi
              sleep 2
            done
            echo "App failed to come up in time"
            sudo docker compose logs --tail=40
            exit 1

      - name: Post-deploy public health check
        run: |
          # citywatch is served by Caddy at its subdomain over HTTPS.
          # Set repo secret CITYWATCH_URL = https://citywatch.<domain>
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 5 "${{ secrets.CITYWATCH_URL }}/" > /dev/null; then
              echo "Public endpoint healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Public endpoint not responding"
          exit 1
